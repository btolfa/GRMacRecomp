name: Verify

on:
  pull_request:
  push:
    branches: [main, gravity_rush, 'gr/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, vet and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: brew install cmake ninja freetype ffmpeg

      - name: Build ps4-recomp
        run: ./scripts/build.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Tests gated on PS4_GR_EBOOT skip here: the game's eboot.bin never leaves the machine.
      - name: Test
        run: go test -count=1 ./...
